<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>AUPP eCampus</title>
    <link rel="icon"
          href="https://raw.githubusercontent.com/pr0meth4us/AUPP-eCampus/dev/frontend/public/favicon.ico"
          type="image/x-icon">
    <link href="https://unpkg.com/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.24/dist/full.css" rel="stylesheet" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            font-family: 'Orbitron', monospace;
            overflow-x: hidden;
        }

        .glow {
            box-shadow: 0 0 50px rgba(139, 69, 255, 0.6);
        }

        .text-glow {
            text-shadow: 0 0 20px rgba(139, 69, 255, 0.8);
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2.4); opacity: 0; }
        }

        .bg-matrix {
            background: linear-gradient(45deg, #0f0f23, #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .neon-border {
            border: 2px solid transparent;
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ffff00, #ff00ff) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: exclude;
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
        }

        .hologram {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-cyber {
            position: relative;
            background: linear-gradient(45deg, #8b5cf6, #06b6d4);
            border: none;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .btn-cyber::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }

        .btn-cyber:hover::before {
            left: 100%;
        }

        .btn-cyber:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #8b5cf6;
            border-radius: 50%;
            animation: particleFloat 20s linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) translateX(100px); opacity: 0; }
        }

        .glitch {
            position: relative;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch::before {
            animation: glitch-1 0.5s infinite;
            color: #ff00ff;
            z-index: -1;
        }

        .glitch::after {
            animation: glitch-2 0.5s infinite;
            color: #00ffff;
            z-index: -2;
        }

        @keyframes glitch-1 {
            0%, 14%, 15%, 49%, 50%, 99%, 100% { transform: translate(0); }
            15%, 49% { transform: translate(-2px, 2px); }
        }

        @keyframes glitch-2 {
            0%, 20%, 21%, 62%, 63%, 99%, 100% { transform: translate(0); }
            21%, 62% { transform: translate(2px, -2px); }
        }
    </style>
</head>
<body class="bg-matrix min-h-screen relative">

<!-- Floating particles -->
<div class="particles">
    <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
    <div class="particle" style="left: 20%; animation-delay: 2s;"></div>
    <div class="particle" style="left: 30%; animation-delay: 4s;"></div>
    <div class="particle" style="left: 40%; animation-delay: 6s;"></div>
    <div class="particle" style="left: 50%; animation-delay: 8s;"></div>
    <div class="particle" style="left: 60%; animation-delay: 10s;"></div>
    <div class="particle" style="left: 70%; animation-delay: 12s;"></div>
    <div class="particle" style="left: 80%; animation-delay: 14s;"></div>
    <div class="particle" style="left: 90%; animation-delay: 16s;"></div>
</div>

<div class="hero min-h-screen flex items-center justify-center relative">
    <div class="hero-content text-center relative z-10">

        <!-- Main card -->
        <div class="hologram rounded-3xl p-12 max-w-2xl relative">

            <!-- Pulsing rings behind logo -->
            <div class="absolute top-8 left-1/2 transform -translate-x-1/2 w-32 h-32">
                <div class="pulse-ring absolute inset-0 border-4 border-purple-500 rounded-full opacity-30"></div>
                <div class="pulse-ring absolute inset-0 border-4 border-cyan-500 rounded-full opacity-20" style="animation-delay: 1s;"></div>
            </div>

            <!-- Logo -->
            <div class="relative mb-8">
                <div class="floating glow w-24 h-24 mx-auto bg-gradient-to-r from-purple-500 via-pink-500 to-cyan-500 rounded-full flex items-center justify-center text-white text-3xl font-black">
                    <img src="https://raw.githubusercontent.com/pr0meth4us/AUPP-eCampus/711111d2e17771a2f9a9a6e0fb787717cf99075c/frontend/public/aupp_ecampus_logo.png">
                </div>
            </div>

            <!-- Title with glitch effect -->
            <h1 class="glitch text-6xl font-black mb-4 bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent text-glow" data-text="AUPP eCampus">
                AUPP eCampus
            </h1>

            <!-- Subtitle -->
            <p class="text-2xl mb-8 text-gray-300 font-light">
                <span class="text-purple-400">Choose Your</span>
                <span class="text-pink-400">Digital</span>
                <span class="text-cyan-400">Gateway</span> 🚀
            </p>

            <!-- Action buttons -->
            <div class="flex flex-col sm:flex-row gap-6 justify-center items-center mt-12">

                <!-- Swagger API Button -->
                <a href="/api/docs" class="btn-cyber btn btn-lg text-white px-8 py-4 rounded-2xl font-bold text-lg group relative overflow-hidden">
                    <div class="flex items-center gap-3">
                        <svg class="w-6 h-6 group-hover:rotate-12 transition-transform duration-300" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M12.316 3.051a1 1 0 01.633 1.265l-4 12a1 1 0 11-1.898-.632l4-12a1 1 0 011.265-.633zM5.707 6.293a1 1 0 010 1.414L3.414 10l2.293 2.293a1 1 0 11-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0zm8.586 0a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 11-1.414-1.414L16.586 10l-2.293-2.293a1 1 0 010-1.414z"/>
                        </svg>
                        <span>API DOCS</span>
                    </div>
                </a>

                <!-- Frontend Button -->
                <a href="#" class="btn-cyber btn btn-lg text-white px-8 py-4 rounded-2xl font-bold text-lg group relative overflow-hidden">
                    <div class="flex items-center gap-3">
                        <svg class="w-6 h-6 group-hover:scale-110 transition-transform duration-300" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h6a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
                        </svg>
                        <span>FRONTEND</span>
                    </div>
                </a>

            </div>

            <!-- Status indicator -->
            <div class="mt-12 flex items-center justify-center gap-3">
                <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
                <span class="text-green-400 font-semibold">System Online</span>
                <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
            </div>

        </div>

    </div>
</div>

<!-- Bottom navigation with cyber theme -->
<div class="fixed bottom-0 left-0 right-0 bg-black bg-opacity-50 backdrop-blur-lg border-t border-purple-500 border-opacity-30">
    <div class="flex justify-center items-center py-4">
        <div class="flex gap-8">
            <button class="text-purple-400 hover:text-purple-300 transition-colors duration-300 flex flex-col items-center gap-1">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10.707 2.293a1 1 0 00-1.414 0l-9 9a1 1 0 001.414 1.414L2 12.414V17a1 1 0 001 1h3a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h3a1 1 0 001-1v-4.586l.293.293a1 1 0 001.414-1.414l-9-9z"/>
                </svg>
                <span class="text-xs font-semibold">HOME</span>
            </button>
            <button class="text-pink-400 hover:text-pink-300 transition-colors duration-300 flex flex-col items-center gap-1" onclick="window.location.href='/api/docs'">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M12.316 3.051a1 1 0 01.633 1.265l-4 12a1 1 0 11-1.898-.632l4-12a1 1 0 011.265-.633z"/>
                </svg>
                <span class="text-xs font-semibold">API</span>
            </button>
            <button class="text-cyan-400 hover:text-cyan-300 transition-colors duration-300 flex flex-col items-center gap-1">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h6a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
                </svg>
                <span class="text-xs font-semibold">APP</span>
            </button>
        </div>
    </div>
</div>

<script>
    // Add some interactive hover effects
    document.querySelectorAll('.btn-cyber').forEach(btn => {
        btn.addEventListener('mouseenter', () => {
            btn.style.transform = 'translateY(-5px) scale(1.05)';
        });

        btn.addEventListener('mouseleave', () => {
            btn.style.transform = 'translateY(0) scale(1)';
        });
    });

    // Add some random particle generation
    function createParticle() {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 20 + 's';
        particle.style.animationDuration = (Math.random() * 10 + 15) + 's';

        const colors = ['#8b5cf6', '#06b6d4', '#f59e0b', '#ef4444'];
        particle.style.background = colors[Math.floor(Math.random() * colors.length)];

        document.querySelector('.particles').appendChild(particle);

        setTimeout(() => {
            particle.remove();
        }, 25000);
    }

    // Generate particles periodically
    setInterval(createParticle, 3000);
</script>

</body>
</html>
